[package]
name = "tuw3"
description = "Reader and writer for TUW3, the open 3D wavetable file format"
keywords = ["wavetable", "audio", "synthesizer", "file-format"]
categories = ["multimedia::audio", "parser-implementations"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

# Keep this crate light: no DSP, GUI or plugin dependencies, so any tool can use it.
[dependencies]
serde = "1.0.229"
# The metadata parser relies on serde_json's default features. Feature unification can enable
# more from any crate in the build: `arbitrary_precision` would change how numbers reach the
# visitor (and accept numbers outside the f64 range). The tests
# `unknown_numbers_keep_their_value` (tests/round_trip.rs) and
# `lone_surrogates_and_out_of_range_numbers_are_rejected` (tests/rejection.rs) guard this.
serde_json = "1.0.154"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
