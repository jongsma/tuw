name: Mirror to Codeberg

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
  workflow_dispatch:

concurrency:
  group: codeberg-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Bare clone
        run: git clone --mirror "https://github.com/${{ github.repository }}.git" repo.git

      - name: Push to Codeberg
        env:
          TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        working-directory: repo.git
        run: |
          git push --prune \
            "https://jongsma:${TOKEN}@codeberg.org/jongsma/tuw.git" \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'
