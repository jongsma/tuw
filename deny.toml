# cargo-deny configuration: `cargo deny check`
# Changes to this file need explicit maintainer approval (see AGENTS.md).

[graph]
all-features = true

[advisories]
# Defaults: known vulnerabilities fail the check.

[licenses]
# Every dependency must be compatible with GPL-3.0-or-later.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.9
# Not every allowed licence is in use yet; that's fine.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
